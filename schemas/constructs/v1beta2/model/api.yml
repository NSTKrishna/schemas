openapi: 3.0.0
info:
  title: Model
  description: OpenAPI schema for Meshery model registration and management.
  version: v1beta2
  contact:
    name: Meshery Maintainers
    email: maintainers@meshery.io
    url: https://meshery.io
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html

security:
  - jwt: []

tags:
  - name: Models
    description: Operations related to mesh models

paths:
  /api/meshmodels:
    get:
      x-internal: ["meshery"]
      tags:
        - Models
      summary: Get list of mesh models
      operationId: getMeshModels
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: string
        - name: pagesize
          in: query
          required: false
          schema:
            type: string
        - name: search
          in: query
          required: false
          schema:
            type: string
        - name: order
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: List of mesh models
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeshModelModelsPage"
        "401":
          $ref: "#/components/responses/401"
        "500":
          description: Internal server error

  /api/meshmodels/components:
    get:
      x-internal: ["meshery"]
      tags:
        - Models
      summary: Get list of components
      operationId: getComponents
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: string
        - name: pagesize
          in: query
          required: false
          schema:
            type: string
        - name: search
          in: query
          required: false
          schema:
            type: string
        - name: order
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: List of components
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeshModelComponentsPage"
        "401":
          $ref: "#/components/responses/401"
        "500":
          description: Internal server error

  /api/meshmodels/relationships:
    get:
      x-internal: ["meshery"]
      tags:
        - Models
      summary: Get list of relationships
      operationId: getRelationships
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: string
        - name: pagesize
          in: query
          required: false
          schema:
            type: string
        - name: search
          in: query
          required: false
          schema:
            type: string
        - name: order
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: List of relationships
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeshModelRelationshipsPage"
        "401":
          $ref: "#/components/responses/401"
        "500":
          description: Internal server error

  /api/meshmodels/registrants:
    get:
      x-internal: ["meshery"]
      tags:
        - Models
      summary: Get list of registrants
      operationId: getRegistrants
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: string
        - name: pagesize
          in: query
          required: false
          schema:
            type: string
        - name: search
          in: query
          required: false
          schema:
            type: string
        - name: order
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: List of registrants
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeshModelRegistrantsPage"
        "401":
          $ref: "#/components/responses/401"
        "500":
          description: Internal server error

  /api/meshmodels/models/{model}/components:
    get:
      x-internal: ["meshery"]
      tags:
        - Models
      summary: Get components of a specific model
      operationId: getComponentsFromModal
      parameters:
        - name: model
          in: path
          required: true
          schema:
            type: string
        - name: page
          in: query
          required: false
          schema:
            type: string
        - name: pagesize
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Components for specified model
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeshModelComponentsPage"
        "401":
          $ref: "#/components/responses/401"
        "500":
          description: Internal server error

  /api/meshmodels/models/{model}/relationships:
    get:
      x-internal: ["meshery"]
      tags:
        - Models
      summary: Get relationships of a specific model
      operationId: getRelationshipsFromModal
      parameters:
        - name: model
          in: path
          required: true
          schema:
            type: string
        - name: page
          in: query
          required: false
          schema:
            type: string
        - name: pagesize
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Relationships for specified model
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeshModelRelationshipsPage"
        "401":
          $ref: "#/components/responses/401"
        "500":
          description: Internal server error

  /api/meshmodels/categories:
    get:
      x-internal: ["meshery"]
      tags:
        - Models
      summary: Get list of model categories
      operationId: getModelCategories
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: string
        - name: pagesize
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: List of categories
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeshModelCategoriesPage"
        "401":
          $ref: "#/components/responses/401"
        "500":
          description: Internal server error

  /api/meshmodels/categories/{category}/models:
    get:
      x-internal: ["meshery"]
      tags:
        - Models
      summary: Get models in a specific category
      operationId: getModelFromCategory
      parameters:
        - name: category
          in: path
          required: true
          schema:
            type: string
        - name: page
          in: query
          required: false
          schema:
            type: string
        - name: pagesize
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Models in category
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeshModelModelsPage"
        "401":
          $ref: "#/components/responses/401"
        "500":
          description: Internal server error

  /api/meshmodels/models/{model}:
    get:
      x-internal: ["meshery"]
      tags:
        - Models
      summary: Get model by name
      operationId: getModelByName
      parameters:
        - name: model
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Model matching name
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeshModelModelsPage"
        "401":
          $ref: "#/components/responses/401"
        "500":
          description: Internal server error

  /api/meshmodels/components/{name}:
    get:
      x-internal: ["meshery"]
      tags:
        - Models
      summary: Get component by name
      operationId: getComponentByName
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Component matching name
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeshModelComponentsPage"
        "401":
          $ref: "#/components/responses/401"
        "500":
          description: Internal server error

  /api/meshmodels/models/{model}/components/{name}:
    get:
      x-internal: ["meshery"]
      tags:
        - Models
      summary: Get components by model and kind
      operationId: getComponentsByModelAndKind
      parameters:
        - name: model
          in: path
          required: true
          schema:
            type: string
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Components matching model and kind
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeshModelComponentsPage"
        "401":
          $ref: "#/components/responses/401"
        "500":
          description: Internal server error

  /api/meshmodels/export:
    get:
      x-internal: ["meshery"]
      tags:
        - Models
      summary: Export a mesh model
      operationId: exportModel
      parameters:
        - name: id
          in: query
          required: false
          schema:
            type: string
        - name: name
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Exported model file
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/401"
        "500":
          description: Internal server error

  /api/meshmodels/register:
    post:
      x-internal: ["cloud", "meshery"]
      tags:
        - Models
      summary: Register mesh models
      operationId: importMeshModel
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/ImportRequest"
      responses:
        "201":
          description: Successful registration
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        "400":
          description: Invalid request format
        "401":
          $ref: "#/components/responses/401"
        "500":
          description: Internal server error

  /api/meshmodels/{entityType}/status:
    post:
      x-internal: ["meshery"]
      tags:
        - Models
      summary: Update status of a mesh model entity
      operationId: updateEntityStatus
      parameters:
        - name: entityType
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - status
              properties:
                id:
                  type: string
                status:
                  type: string
                displayName:
                  type: string
      responses:
        "200":
          description: Entity status updated successfully
        "400":
          description: Bad request
        "401":
          $ref: "#/components/responses/401"
        "500":
          description: Internal server error

  /api/integrations/meshmodels/models:
    get:
      x-internal: ["cloud"]
      tags:
        - Models
      summary: Get mesh model models
      operationId: getMeshModelModels
      parameters:
        - name: page
          in: query
          required: false
          description: Current page number of the result set.
          schema:
            type: integer
            minimum: 0
        - name: pageSize
          in: query
          required: false
          description: Number of items per page.
          schema:
            type: integer
            minimum: 1
        - name: search
          in: query
          required: false
          description: Free-text search query applied to model names.
          schema:
            type: string
            maxLength: 255
        - name: order
          in: query
          required: false
          description: Sort order for the result set (e.g. "name asc").
          schema:
            type: string
            maxLength: 255
      responses:
        "200":
          description: Model and capabilities registry entries retrieved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeshModelModelsPage"
        "401":
          $ref: "#/components/responses/401"
        "500":
          description: Internal server error
components:
  responses:
    401:
      $ref: "../core/api.yml#/components/responses/401"

  securitySchemes:
    jwt:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Model:
      type: object
      description: "Registrant-defined data associated with the model. Properties pertain to the software being managed (e.g. Kubernetes v1.31)."
      required:
        - version
      properties:
        version:
          description: "Version of the model as defined by the registrant."
          $ref: "../core/api.yml#/components/schemas/SemverString"
          x-oapi-codegen-extra-tags:
            json: "version"
          x-order: 1

    ModelDefinition:
      $ref: "./model.yaml"

    RegistrantReference:
      "type": "object"
      required:
        - "kind"
      "properties":
        "kind":
          "type": "string"
          description: Kind of the registrant.
          maxLength: 255

    ModelReference:
      type: "object"
      "required":
        ["id", "name", "version", "displayName", "model", "registrant"]
      "properties":
        id:
          "$ref": "../core/api.yml#/components/schemas/Uuid"
        name:
          type: string
          description: The unique name for the model within the scope of a registrant.
          pattern: ^[a-z0-9-]+$
          examples:
            - cert-manager
        version:
          "$ref": "../core/api.yml#/components/schemas/SemverString"
          description: Version of the model definition.
        displayName:
          type: string
          description: Human-readable name for the model.
          minLength: 1
          maxLength: 100
          pattern: ^[a-zA-Z0-9 ]+$
          examples:
            - Cert Manager
        model:
          "$ref": "./api.yml#/components/schemas/Model"
        registrant:
          "x-go-type": "RegistrantReference"
          "$ref": "#/components/schemas/RegistrantReference"
          x-oapi-codegen-extra-tags:
            json: "registrant"

      "description": "Reference to the specific registered model to which the component belongs and from which model version, category, and other properties may be referenced. Learn more at https://docs.meshery.io/concepts/models"

    ImportRequest:
      type: object
      required:
        - importBody
        - uploadType
        - register
      properties:
        importBody:
          $ref: "#/components/schemas/ImportBody"
        uploadType:
          type: string
          title: "Upload method"
          x-enum-casing-exempt: true
          enum: ["file", "urlImport", "csv", "url"]
          enumDescriptions:
            [
              "Upload a model file (.tar, .tar.gz, .tgz) from your local system",
              "Import a model file using a direct URL to the source",
              "Upload separate CSV files for model definitions, components, and their relationships",
            ]
          description: "Choose the method you prefer to upload your model file. Select 'File Import' or 'CSV Import' if you have the file on your local system or 'URL Import' if you have the file hosted online."
        register:
          type: boolean
          nullable: false
          description: The register of the importrequest.

    ImportBody:
      oneOf:
        - title: File Import
          type: object
          required: [fileName, modelFile]
          properties:
            fileName:
              type: string
              description: "Name of the file being uploaded."
              maxLength: 255
            modelFile:
              type: string
              description: "Supported model file formats are: .tar, .tar.gz, and .tgz. See [Import Models Documentation](https://docs.meshery.io/guides/configuration-management/importing-models#import-models-using-meshery-ui) for details"

        - title: URL Import
          type: object
          required: [url]
          properties:
            url:
              type: string
              format: uri
              description: 'A direct URL to a single model file, for example: https://raw.github.com/your-model-file.tar. Supported model file formats are: .tar, .tar.gz, and .tgz. \n\nFor bulk import of your model use the GitHub connection or CSV files. See [Import Models Documentation](https://docs.meshery.io/guides/configuration-management/importing-models#import-models-using-meshery-ui) for details'

        - title: CSV Import
          type: object
          required: [modelCsv, componentCsv, relationshipCsv]
          properties:
            modelCsv:
              type: string
              format: binary
              description: Upload a CSV file containing model definitions
            componentCsv:
              type: string
              format: binary
              description: Upload a CSV file containing component definitions
            relationshipCsv:
              type: string
              format: binary
              description: Upload a CSV file containing relationship definitions

        - title: Model Create
          type: object
          required: [model, url]
          properties:
            url:
              type: string
              description: "URI to the source code or package of the model."
              format: uri
              oneOf:
                - title: "GitHub"
                  type: string
                  pattern: "^git://github\\.com/[\\w.-]+/[\\w.-]+(/[\\w.-]+/[\\w/-]+)?$"
                  description: "Git protocol URL for GitHub repository or specific resource path"
                  example: "git://github.com/cert-manager/cert-manager/master/deploy/crds"
                  x-metadata:
                    uiType: "url"
                    validationHint: "Enter a git protocol URL (e.g., git://github.com/owner/repo)"
                - title: "Artifact Hub"
                  type: string
                  pattern: "^https:\\/\\/artifacthub\\.io\\/packages\\/(search\\?ts_query_web=[\\w.-]+|[\\w.-]+\\/[\\w.-]+\\/[\\w.-]+)$"
                  description: "Artifact Hub package URL or search query URL with model name parameter"
                  example: "https://artifacthub.io/packages/search?ts_query_web={model-name}"
                  x-metadata:
                    uiType: "url"
                    validationHint: "Enter an Artifact Hub URL (e.g., https://artifacthub.io/packages/search?ts_query_web={meshery-operator})"

    MeshModelModelsPage:
      type: object
      description: Page of mesh models matching the list-endpoint query.
      properties:
        page:
          type: integer
          description: Current page number of the result set.
          minimum: 0
          x-oapi-codegen-extra-tags:
            json: "page,omitempty"
        pageSize:
          type: integer
          description: Number of items per page.
          minimum: 1
          x-oapi-codegen-extra-tags:
            json: "pageSize,omitempty"
        totalCount:
          type: integer
          description: Total number of items available.
          minimum: 0
          x-oapi-codegen-extra-tags:
            json: "totalCount,omitempty"
        models:
          type: array
          items:
            $ref: "#/components/schemas/ModelDefinition"
          description: The models matching the list-endpoint query.

    MeshModelComponentsPage:
      type: object
      properties:
        page:
          type: integer
          minimum: 0
        pageSize:
          type: integer
          minimum: 1
        totalCount:
          type: integer
          minimum: 0
        components:
          type: array
          items:
            type: object
            additionalProperties: true

    MeshModelRelationshipsPage:
      type: object
      properties:
        page:
          type: integer
          minimum: 0
        pageSize:
          type: integer
          minimum: 1
        totalCount:
          type: integer
          minimum: 0
        relationships:
          type: array
          items:
            type: object
            additionalProperties: true

    MeshModelRegistrantsPage:
      type: object
      properties:
        page:
          type: integer
          minimum: 0
        pageSize:
          type: integer
          minimum: 1
        totalCount:
          type: integer
          minimum: 0
        registrants:
          type: array
          items:
            type: object
            additionalProperties: true

    MeshModelCategoriesPage:
      type: object
      properties:
        page:
          type: integer
          minimum: 0
        pageSize:
          type: integer
          minimum: 1
        totalCount:
          type: integer
          minimum: 0
        categories:
          type: array
          items:
            type: object
            additionalProperties: true

    MesheryModelImportFormPayload:
      type: object
      description: >
        Flat canonical representation of the model import form that combines
        the UI-level uploadType discriminator with the union of fields from
        the ImportBody oneOf variants. This schema is the authoritative source
        for the canonical RJSF form schema at
        schemas/constructs/v1beta2/model/forms/import.json. The server
        receives an ImportRequest; this form schema captures the superset of
        user-facing fields so the form schema can be validated as a subset of
        this canonical type.
      required:
        - uploadType
      properties:
        uploadType:
          type: string
          title: "Upload method"
          x-enum-casing-exempt: true
          enum: ["file", "urlImport", "csv"]
          enumNames: ["File Import", "URL Import", "CSV Import"]
          description: "Choose the method you prefer. Select 'File Import' or 'CSV Import' if you have the file on your local system, or 'URL Import' if you have the file hosted online."
        fileName:
          type: string
          description: "Name of the model file being uploaded."
          maxLength: 255
        modelFile:
          type: string
          description: "Model file content. Supported formats: .tar, .tar.gz, .tgz."
        url:
          type: string
          format: uri
          description: "A direct URL to a single model file. Supported formats: .tar, .tar.gz, .tgz."
        modelCsv:
          type: string
          format: binary
          description: "CSV file containing model definitions."
        componentCsv:
          type: string
          format: binary
          description: "CSV file containing component definitions."
        relationshipCsv:
          type: string
          format: binary
          description: "CSV file containing relationship definitions."
